<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Job Tracker</title>
  <meta name="description" content="Capture job postings and track what you've applied to." />
  <meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#111317" media="(prefers-color-scheme: dark)" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="top">
    <div class="top-row">
      <h1>Jobs</h1>
      <button id="menu-btn" class="icon-btn" aria-label="Settings">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg>
      </button>
    </div>

    <form id="capture" class="capture" autocomplete="off">
      <textarea id="capture-input" rows="1" placeholder="Paste job link(s)" aria-label="Job posting link or links, one per line" inputmode="url" spellcheck="false"></textarea>
      <button type="submit" class="btn primary">Save</button>
    </form>

    <nav class="tabs" role="tablist" aria-label="Filter">
      <button role="tab" data-filter="todo">To apply <span class="count" data-count="todo"></span></button>
      <button role="tab" data-filter="applied">Applied <span class="count" data-count="applied"></span></button>
      <button role="tab" data-filter="all">All <span class="count" data-count="all"></span></button>
    </nav>

    <div class="search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></svg>
      <input id="search" type="search" placeholder="Search title or company" aria-label="Search title or company" />
    </div>
  </header>

  <main>
    <ul id="list" class="list"></ul>
    <div id="empty" class="empty" hidden></div>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden>
    <span id="toast-msg"></span>
    <button id="toast-action" type="button" hidden></button>
  </div>

  <dialog id="settings" class="sheet">
    <form method="dialog" class="sheet-inner">
      <div class="sheet-head">
        <h2>Settings</h2>
        <button class="icon-btn" value="close" aria-label="Close">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
      <p id="stats" class="muted"></p>
      <button type="button" id="export-btn" class="btn block">Export JSON</button>
      <button type="button" id="import-btn" class="btn block">Import JSON</button>
      <button type="button" id="install-btn" class="btn block" hidden>Install app</button>
      <p class="muted small">Your data is stored only in this browser on this device. Export regularly to keep a backup. Importing adds records to what's already here and skips links you've already saved.</p>
    </form>
  </dialog>
  <input id="import-file" type="file" accept="application/json,.json" hidden />

  <script type="module" src="src/app.js"></script>
</body>
</html>
